<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async JS Homework</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #status-message {
            font-size: 24px;
            font-weight: bold;
            color: #555;
            margin-top: 50px;
        }
        .error { color: red; }
        .info { color: blue; }

        .controls {
            margin-bottom: 20px;
            display: none; 
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
        }
        button:hover { background-color: #0056b3; }
        button.delete-all { background-color: #dc3545; }
        button.delete-all:hover { background-color: #bd2130; }

        #container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card button {
            background-color: #ffc107;
            color: black;
            font-size: 14px;
        }
        .card button:hover { background-color: #e0a800; }
    </style>
</head>
<body>

    <div id="status-message">Данные загружаются...</div>

    <div class="controls" id="controls">
        <button id="btn-get-all">Получить все карточки</button>
        <button id="btn-delete-all" class="delete-all">Удалить все карточки</button>
    </div>

    <div id="container"></div>

    <script src="async.js"></script>
</body>
</html>
