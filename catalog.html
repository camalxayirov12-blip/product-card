<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог Diamaint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="bg-wrapper">
    <img src="img/bg-dandelions.png" alt="" class="bg-pattern">
  </div>
  <main class="container">
    <h1 class="main-title">Выбери свой продукт</h1>
    <button type="button" class="btn-toggle">Сменить цвет</button>
    <div id="productGrid" class="product-grid"></div>
  </main>

  <div id="orderModal" class="modal" aria-hidden="true">
    <div class="modal__dialog" role="dialog" aria-labelledby="orderModalTitle">
      <button type="button" class="modal__close" aria-label="Закрыть">&times;</button>
      <h2 id="orderModalTitle" class="modal__title">Оформление заказа</h2>
      <form id="orderForm" class="order-form">
        <input type="hidden" name="productTitle" id="orderProductTitle" value="">
        <label class="order-form__field">
          <span>Ваше имя</span>
          <input type="text" name="customerName" required minlength="2" autocomplete="name">
        </label>
        <label class="order-form__field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label class="order-form__field">
          <span>Телефон</span>
          <input type="tel" name="phone" required minlength="10" autocomplete="tel">
        </label>
        <label class="order-form__field">
          <span>Комментарий</span>
          <textarea name="comment" rows="3"></textarea>
        </label>
        <div class="order-form__actions">
          <button type="submit" class="btn-submit">Отправить</button>
        </div>
      </form>
    </div>
  </div>

  <template id="productCardTemplate">
    <article class="card">
      <div class="card__img">
        <img src="" alt="">
      </div>
      <div class="card__info">
        <span class="card__label"></span>
        <h2 class="card__title"></h2>
        <p class="card__text"></p>
        <span class="card__label">Состав:</span>
        <ul class="card__list"></ul>
        <div class="card__footer">
          <span class="card__price-text">Цена</span>
          <span class="card__price-value"></span>
        </div>
        <button type="button" class="card__order">Заказать</button>
      </div>
    </article>
  </template>

  <footer class="footer">
    <nav class="footer-nav">
      <a href="index.html">← Кафе (ДЗ 11)</a>
    </nav>
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
