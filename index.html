<!DOCTYPE html>

<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог Diamaint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="bg-wrapper">
    <img src="img/bg-dandelions.png" alt="" class="bg-pattern">
  </div>
  <main class="container">
    <h1 class="main-title">Выбери свой продукт</h1>
    <button class="btn-toggle">Сменить цвет</button>
    <div id="productGrid" class="product-grid"></div>
  </main>

  <template id="productCardTemplate">
    <article class="card">
      <div class="card__img">
        <img src="" alt="">
      </div>
      <div class="card__info">
        <span class="card__label"></span>
        <h2 class="card__title"></h2>
        <p class="card__text"></p>
        <span class="card__label">Состав:</span>
        <ul class="card__list"></ul>
        <div class="card__footer">
          <span class="card__price-text">Цена</span>
          <span class="card__price-value"></span>
        </div>
      </div>
    </article>
  </template>
  <footer class="footer">
    <nav class="footer-nav">
      <a href="#">О нас</a>
      <a href="#">Каталог</a>
      <a href="#">Контакты</a>
    </nav>
    <form id="subscribeForm" class="subscribe-form">
      <label for="email">Подпишись на рассылку:</label>
      <input id="email" name="email" type="email" placeholder="Введите email" required>
      <button type="submit">Подписаться</button>
    </form>
  </footer>

  <button id="registerBtn" class="register-btn">Регистрация</button>
  <div id="modal" class="modal">
    <div class="overlay modal-overlay"></div>
    <div class="modal-content">
      <button id="closeModalBtn" class="modal-close" type="button">&times;</button>
      <h2>Регистрация:</h2>
      <form id="registerForm" novalidate>
        <label for="firstName">Имя:</label>
        <input id="firstName" name="firstName" type="text" placeholder="Введите имя" required minlength="2">

        <label for="lastName">Фамилия:</label>
        <input id="lastName" name="lastName" type="text" placeholder="Введите фамилию" required minlength="2">

        <label for="birthDate">Дата рождения:</label>
        <input id="birthDate" name="birthDate" type="date" required>

        <label for="login">Логин:</label>
        <input id="login" name="login" type="text" placeholder="Введите логин" required minlength="4">

        <label for="password">Пароль:</label>
        <input id="password" name="password" type="password" placeholder="Введите пароль" required minlength="6">

        <label for="repeatPassword">Пароль повторно:</label>
        <input id="repeatPassword" name="repeatPassword" type="password" placeholder="Повторите пароль" required
          minlength="6">

        <button type="submit">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <script type="module" src="homework-9.js"></script>
</body>

</html>
